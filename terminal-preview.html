<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glassfloor — Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0B0B0B; --panel:#131316; --rule:#232327; --text:#F5F5F3; --muted:#7A7A7E; --cyan:#6FD8CB; --amber:#E8A33D; --down:#E2626B; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh;}
  .mono{font-family:'JetBrains Mono', monospace;}
  header{display:flex; justify-content:space-between; align-items:center; padding:22px 32px; border-bottom:1px solid var(--rule);}
  .logo{font-weight:800; font-size:16px;}
  a.back{color:var(--muted); font-size:13px; text-decoration:none;}
  .tier-pill{font-size:11px; text-transform:uppercase; letter-spacing:0.06em; padding:5px 14px; border-radius:100px; border:1px solid var(--cyan); color:var(--cyan);}

  #app{max-width:1000px; margin:0 auto; padding:60px 32px;}
  .state-box{text-align:center; padding:100px 20px;}
  .state-box h2{font-weight:800; font-size:30px; letter-spacing:-0.02em; margin-bottom:14px;}
  .state-box p{color:var(--muted); font-size:14.5px; max-width:420px; margin:0 auto 28px; line-height:1.6;}
  .btn{display:inline-block; background:#fff; color:#0B0B0B; padding:13px 28px; border-radius:100px; font-weight:700; font-size:14px; text-decoration:none;}

  .panel{background:var(--panel); border:1px solid var(--rule); border-radius:8px; padding:24px; margin-bottom:16px;}
  .price{font-weight:800; font-size:34px;}
  .stats-row{display:flex; gap:24px; margin:14px 0; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); flex-wrap:wrap;}
  .stats-row b{color:var(--text);}
  .data-badge{font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--amber); border:1px solid var(--amber); padding:4px 10px; border-radius:100px; display:inline-block; margin-bottom:14px;}
</style>
</head>
<body>

<header>
  <div class="logo">glassfloor</div>
  <a href="index.html" class="back">← back</a>
  <div class="tier-pill" id="tierPill">…</div>
</header>

<div id="app"><div class="state-box"><h2>Loading…</h2></div></div>

<script type="module">
  const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Mid tier's terminal unlocks on this day each week. 1 = Monday (0 = Sunday).
  const MID_UNLOCK_DAY = 1;
  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  const app = document.getElementById('app');
  const tierPill = document.getElementById('tierPill');

  async function init(){
    const { data: { session } } = await supabase.auth.getSession();

    if (!session){
      tierPill.textContent = 'Signed out';
      app.innerHTML = stateBox(
        'Sign in to open the terminal',
        'The terminal is part of your account — sign in or start a free account from the homepage first.',
        'index.html', 'Go sign in'
      );
      return;
    }

    const { data: profile, error } = await supabase
      .from('profiles')
      .select('tier')
      .eq('id', session.user.id)
      .single();

    const tier = profile?.tier || 'free';
    tierPill.textContent = tier.charAt(0).toUpperCase() + tier.slice(1);
    render(tier);
  }

  function render(tier){
    if (tier === 'free'){
      app.innerHTML = terminalMarkup('Historical simulator', 'Free — historical data only');
      return;
    }
    if (tier === 'pro'){
      app.innerHTML = terminalMarkup('Real-time terminal', 'Pro — full-time real-time access');
      return;
    }
    // mid tier: only unlocked on MID_UNLOCK_DAY
    const today = new Date().getDay();
    if (today === MID_UNLOCK_DAY){
      app.innerHTML = terminalMarkup('15-min delayed terminal', 'Mid — unlocked today');
      return;
    }
    const daysUntil = (MID_UNLOCK_DAY - today + 7) % 7 || 7;
    app.innerHTML = stateBox(
      `Your weekly access unlocks ${dayNames[MID_UNLOCK_DAY]}`,
      `Mid tier gets the 15-min-delayed terminal one day a week. That's in ${daysUntil} day${daysUntil > 1 ? 's' : ''} — or upgrade to Pro for full-time access, any day.`,
      '#', 'Upgrade to Pro'
    );
  }

  function stateBox(title, body, href, cta){
    return `<div class="state-box">
      <h2>${title}</h2>
      <p>${body}</p>
      <a class="btn" href="${href}">${cta}</a>
    </div>`;
  }

  function terminalMarkup(label, badge){
    return `
      <div class="panel">
        <div class="data-badge">${badge}</div>
        <div class="price">$231.84 <span class="mono" style="font-size:14px; color:var(--cyan);">▲ +1.07%</span></div>
        <div style="color:var(--muted); font-size:13px; margin-top:4px;">Apple Inc. · AAPL · ${label}</div>
        <div class="stats-row">
          <div>OPEN <b>229.40</b></div><div>HIGH <b>232.90</b></div><div>LOW <b>228.70</b></div><div>VOL <b>42.1M</b></div>
        </div>
        <svg viewBox="0 0 900 180" width="100%" height="180">
          <polyline fill="none" stroke="#6FD8CB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            points="0,130 70,122 140,128 210,102 280,110 350,86 420,94 490,68 560,76 630,50 700,58 770,34 840,40 900,22"/>
        </svg>
      </div>
      <div class="panel">
        <div class="data-badge" style="border-color:var(--cyan); color:var(--cyan);">Co-pilot</div>
        <div style="font-size:13.5px; color:var(--muted); line-height:1.6;">Click any metric on the chart to get a plain-English explanation of what it means — available at every tier.</div>
      </div>`;
  }

  init();
</script>

</body>
</html>
