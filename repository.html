<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassfloor — Knowledge Repository</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #0B0B0B; color: #fff; padding-top: 100px; min-height: 100vh; }
    
    nav { 
      display: flex; justify-content: space-between; align-items: center; 
      padding: 24px 40px; position: fixed; top: 0; left: 0; right: 0; z-index: 30; 
      background: rgba(11, 11, 11, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #1C1C1C; 
    }
    .logo { font-weight: 800; font-size: 16px; color: #fff; text-decoration: none; }
    .nav-right { display: flex; gap: 12px; align-items: center; }
    .nav-btn { font-size: 13px; padding: 9px 18px; border-radius: 100px; font-weight: 600; border: 1px solid #333; color: #fff; background: transparent; cursor: pointer; text-decoration: none; }

    .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
    .header { margin-bottom: 30px; text-align: left; }
    .header h1 { font-size: 42px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 8px; }
    .header p { color: #8A8A8A; font-size: 16px; }

    /* Controls: Search Bar & Category Filters */
    .controls { display: flex; flex-direction: column; gap: 16px; margin-bottom: 32px; }
    .search-input { width: 100%; background: #131316; border: 1px solid #232327; color: #fff; padding: 14px 18px; border-radius: 8px; font-size: 14px; outline: none; }
    .search-input:focus { border-color: #444; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn { background: #131316; border: 1px solid #232327; color: #8A8A8A; padding: 6px 14px; border-radius: 100px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .filter-btn.active, .filter-btn:hover { background: #fff; color: #0B0B0B; border-color: #fff; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background: #131316; border: 1px solid #232327; border-radius: 12px; padding: 24px; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .tier-badge { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; padding: 4px 10px; border-radius: 100px; border: 1px solid #333; color: #8A8A8A; }
    .category-tag { font-size: 11px; color: #666; font-weight: 600; text-transform: capitalize; }
    .card h3 { font-size: 18px; font-weight: 700; margin-bottom: 10px; line-height: 1.3; }
    .card p { font-size: 13.5px; color: #8A8A8A; line-height: 1.6; margin-bottom: 20px; }
    .read-btn { background: #fff; color: #0B0B0B; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; align-self: flex-start; }
    
    .locked { opacity: 0.6; }
    .locked .read-btn { background: #222; color: #777; cursor: not-allowed; }

    /* Article Reader Drawer */
    .drawer { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; justify-content: flex-end; }
    .drawer.open { display: flex; }
    .drawer-content { background: #131316; width: 100%; max-width: 600px; height: 100%; padding: 40px; overflow-y: auto; border-left: 1px solid #232327; position: relative; }
    .close-drawer { position: absolute; top: 20px; right: 20px; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
    .drawer h2 { font-size: 28px; font-weight: 800; margin-bottom: 16px; }
    .drawer-body { color: #CCCCCC; font-size: 15px; line-height: 1.8; margin-top: 24px; white-space: pre-wrap; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">glassfloor</a>
    <div class="nav-right" id="navRight">
      <a href="index.html" class="nav-btn">Home</a>
    </div>
  </nav>

  <div class="container">
    <div class="header">
      <h1>Repository</h1>
      <p>Plain-English breakdown archives and market debriefs.</p>
    </div>

    <!-- Search & Filter Controls -->
    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Search by title, topic, or keyword..." oninput="filterArticles()">
      <div class="filters">
        <button class="filter-btn active" onclick="setCategory('all', this)">All</button>
        <button class="filter-btn" onclick="setCategory('macro', this)">Macro</button>
        <button class="filter-btn" onclick="setCategory('equities', this)">Equities</button>
        <button class="filter-btn" onclick="setCategory('crypto', this)">Crypto</button>
        <button class="filter-btn" onclick="setCategory('policy', this)">Policy</button>
      </div>
    </div>

    <div class="grid" id="articlesGrid">
      <p style="color: #666;">Loading repository content...</p>
    </div>
  </div>

  <!-- Article Drawer -->
  <div class="drawer" id="articleDrawer">
    <div class="drawer-content">
      <button class="close-drawer" onclick="closeDrawer()">×</button>
      <div class="tier-badge" id="drawerTier">FREE</div>
      <h2 id="drawerTitle">Article Title</h2>
      <div class="drawer-body" id="drawerBody">Body text loads here...</div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = "https://wclodubfdmmqfwsznzbs.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjbG9kdWJmZG1tcWZ3c3puemJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MzA1MTMsImV4cCI6MjEwMzMwNjUxM30.mfF_8FWI_7IF1JlGlQTU3647CrioDteoCKjY2MCChrQ";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUserTier = 'free';
    let allArticles = [];
    let selectedCategory = 'all';

    const tierHierarchy = { free: 1, mid: 2, pro: 3 };

    async function initRepository() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        const { data: profile } = await supabase.from('user_profiles').select('tier').eq('id', session.user.id).single();
        if (profile) currentUserTier = profile.tier || 'free';
      }

      const { data: articles, error } = await supabase.from('knowledge_repository').select('*');
      if (error || !articles || articles.length === 0) {
        document.getElementById('articlesGrid').innerHTML = '<p style="color: #8A8A8A;">No articles found in the repository yet.</p>';
        return;
      }

      allArticles = articles;
      window.articlesCache = articles;
      renderArticles(allArticles);
    }

    function renderArticles(articlesToRender) {
      const grid = document.getElementById('articlesGrid');

      if (articlesToRender.length === 0) {
        grid.innerHTML = '<p style="color: #8A8A8A;">No articles match your search criteria.</p>';
        return;
      }

      grid.innerHTML = articlesToRender.map(article => {
        const tier = article.tier_required || article.access_tier || 'free';
        const articleLevel = tierHierarchy[tier] || 1;
        const userLevel = tierHierarchy[currentUserTier] || 1;
        const isLocked = articleLevel > userLevel;
        const category = article.category || 'Macro';

        return `
          <div class="card ${isLocked ? 'locked' : ''}">
            <div>
              <div class="card-top">
                <span class="tier-badge">${tier.toUpperCase()}</span>
                <span class="category-tag">${category}</span>
              </div>
              <h3>${article.title}</h3>
              <p>${article.summary || 'No summary available.'}</p>
            </div>
            <button class="read-btn" onclick="openArticle('${article.id}', ${isLocked})">
              ${isLocked ? '🔒 Upgrade to Access' : 'Read Breakdown'}
            </button>
          </div>
        `;
      }).join('');
    }

    window.filterArticles = () => {
      const query = document.getElementById('searchInput').value.toLowerCase();

      const filtered = allArticles.filter(article => {
        const matchesQuery = (article.title && article.title.toLowerCase().includes(query)) ||
                             (article.summary && article.summary.toLowerCase().includes(query));
        
        const articleCategory = (article.category || 'macro').toLowerCase();
        const matchesCategory = selectedCategory === 'all' || articleCategory === selectedCategory;

        return matchesQuery && matchesCategory;
      });

      renderArticles(filtered);
    };

    window.setCategory = (category, btn) => {
      selectedCategory = category;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterArticles();
    };

    window.openArticle = (id, isLocked) => {
      if (isLocked) {
        alert(`This article requires a higher tier plan.`);
        return;
      }
      const article = window.articlesCache.find(a => a.id == id);
      if (!article) return;

      const tier = article.tier_required || article.access_tier || 'free';
      document.getElementById('drawerTier').textContent = tier.toUpperCase();
      document.getElementById('drawerTitle').textContent = article.title;
      document.getElementById('drawerBody').textContent = article.content || article.summary;
      document.getElementById('articleDrawer').classList.add('open');
    };

    window.closeDrawer = () => {
      document.getElementById('articleDrawer').classList.remove('open');
    };

    initRepository();
  </script>
</body>
</html>
