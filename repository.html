<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassfloor - Knowledge Repository</title>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #e1e3e6;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            margin-bottom: 35px;
            border-bottom: 1px solid #232733;
            padding-bottom: 20px;
        }

        header h1 {
            font-size: 28px;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        header p {
            color: #8b92a0;
            font-size: 14px;
        }

        .loading-state, .empty-state, .error-state {
            padding: 40px;
            text-align: center;
            background: #141721;
            border: 1px solid #232733;
            border-radius: 8px;
            color: #8b92a0;
        }

        .article-card {
            background: #141721;
            border: 1px solid #232733;
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 24px;
            transition: border-color 0.2s ease;
        }

        .article-card:hover {
            border-color: #3b4254;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .tag {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(0, 230, 118, 0.1);
            color: #00e676;
            border: 1px solid rgba(0, 230, 118, 0.2);
        }

        .article-title {
            font-size: 20px;
            color: #f0f2f5;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .mode-toggle-bar {
            display: inline-flex;
            background: #0d0e12;
            padding: 3px;
            border-radius: 6px;
            border: 1px solid #232733;
            margin-bottom: 18px;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: #8b92a0;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: #232733;
            color: #ffffff;
        }

        .article-body {
            font-size: 14px;
            line-height: 1.65;
            color: #c2c7d0;
            white-space: pre-line;
        }

        .simplified-box {
            background: rgba(41, 98, 255, 0.08);
            border-left: 3px solid #2962ff;
            padding: 14px 16px;
            border-radius: 0 6px 6px 0;
            color: #d1dbe6;
        }

        .card-footer {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #1c202b;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #636b7b;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Knowledge Repository</h1>
            <p>Automated macro research, institutional breakdowns, and simplified market analysis.</p>
        </header>

        <div id="articles-container">
            <div class="loading-state">Loading intelligence updates from Supabase...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wclodubfdmmqfwsznzbs.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjbG9kdWJmZG1tcWZ3c3puemJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MzA1MTMsImV4cCI6MjEwMzMwNjUxM30.mfF_8FWI_7IF1JlGlQTU3647CrioDteoCKjY2MCChrQ";

        // Correct CDN initialization
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function getSimplifiedSummary(text) {
            if (!text) return "No summary available.";
            const sentences = text.split('. ');
            return sentences.slice(0, 2).join('. ') + (sentences.length > 2 ? '.' : '');
        }

        async function loadRepository() {
            const container = document.getElementById('articles-container');

            try {
                const { data: articles, error } = await supabaseClient
                    .from('knowledge_repository')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error("Supabase Error:", error);
                    throw error;
                }

                if (!articles || articles.length === 0) {
                    container.innerHTML = `<div class="empty-state">No analysis reports found in the database.</div>`;
                    return;
                }

                container.innerHTML = articles.map(article => {
                    const fullText = article.summary || article.content || 'No content available.';
                    const simpleText = getSimplifiedSummary(fullText);
                    const formattedDate = article.created_at ? new Date(article.created_at).toLocaleDateString() : 'Live';

                    return `
                        <div class="article-card" id="article-${article.id}">
                            <div class="card-header">
                                <span class="tag">${article.category || 'Macro & Market Intelligence'}</span>
                            </div>
                            
                            <h2 class="article-title">${article.title}</h2>

                            <div class="mode-toggle-bar">
                                <button class="mode-btn active" onclick="toggleMode(${article.id}, 'detailed')">Detailed Analysis</button>
                                <button class="mode-btn" onclick="toggleMode(${article.id}, 'simple')">Explain Simply</button>
                            </div>

                            <div class="article-body" id="content-${article.id}">
                                ${fullText}
                            </div>

                            <div class="card-footer">
                                <span>Source: ${article.source || 'Market Feed'}</span>
                                <span>${formattedDate}</span>
                            </div>

                            <template id="detailed-data-${article.id}">${fullText}</template>
                            <template id="simple-data-${article.id}">${simpleText}</template>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error('Error loading repository:', err);
                container.innerHTML = `<div class="error-state">Failed to load articles. Check browser console for details or verify Supabase SELECT policies.</div>`;
            }
        }

        function toggleMode(articleId, mode) {
            const card = document.getElementById(`article-${articleId}`);
            const contentBox = document.getElementById(`content-${articleId}`);
            const buttons = card.querySelectorAll('.mode-btn');

            buttons.forEach(btn => btn.classList.remove('active'));

            if (mode === 'simple') {
                buttons[1].classList.add('active');
                const simpleData = document.getElementById(`simple-data-${articleId}`).innerHTML;
                contentBox.innerHTML = `<div class="simplified-box"><strong>Key Takeaway:</strong><br>${simpleData}</div>`;
            } else {
                buttons[0].classList.add('active');
                const detailedData = document.getElementById(`detailed-data-${articleId}`).innerHTML;
                contentBox.innerHTML = detailedData;
            }
        }

        document.addEventListener('DOMContentLoaded', loadRepository);
    </script>
</body>
</html>
