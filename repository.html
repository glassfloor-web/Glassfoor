<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>glassfloor — Research Repository</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --card-bg: #121212;
      --card-border: #222222;
      --text-main: #f0f0f0;
      --text-muted: #888888;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 2rem; min-height: 100vh; }

    header { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 3rem auto; }
    .logo { font-weight: 700; font-size: 1.5rem; }
    .nav-btn { background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 0.5rem 1.2rem; border-radius: 20px; text-decoration: none; font-size: 0.85rem; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; max-width: 1200px; margin: 0 auto; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; height: 420px; }

    .badges { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .badge { font-size: 0.65rem; text-transform: uppercase; padding: 0.2rem 0.5rem; border-radius: 4px; background: #1e1e1e; color: var(--text-muted); border: 1px solid #333; }

    .card-title { font-size: 1.1rem; font-weight: 600; line-height: 1.4; margin-bottom: 1rem; color: var(--text-main); }
    .card-snippet { font-size: 0.825rem; line-height: 1.6; color: var(--text-muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; white-space: pre-line; }

    .read-btn { margin-top: 1rem; background: #ffffff; color: #000000; border: none; padding: 0.75rem; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; width: 100%; }

    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: none; z-index: 90; }
    .drawer { position: fixed; top: 0; right: -550px; width: 100%; max-width: 550px; height: 100vh; background: #111111; border-left: 1px solid #222; z-index: 100; transition: right 0.3s ease; padding: 2.5rem; overflow-y: auto; }
    .drawer.open { right: 0; }
    .overlay.open { display: block; }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; float: right; }
    .drawer-title { font-size: 1.3rem; margin: 1.5rem 0 1rem 0; }
    .drawer-body { font-size: 0.9rem; line-height: 1.7; color: #ccc; white-space: pre-line; }

    .status-msg { grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 4rem; }
  </style>
</head>
<body>

  <header>
    <div class="logo">glassfloor</div>
    <a href="index.html" class="nav-btn">Home</a>
  </header>

  <main class="grid" id="repository-grid">
    <div class="status-msg" id="status-msg">Fetching records...</div>
  </main>

  <div class="overlay" id="drawer-overlay" onclick="closeModal()"></div>
  <div class="drawer" id="modal-drawer">
    <button class="close-btn" onclick="closeModal()">&times;</button>
    <div class="badges">
      <span class="badge" id="modal-tier">FREE</span>
    </div>
    <h2 class="drawer-title" id="modal-title"></h2>
    <div class="drawer-body" id="modal-body"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://wclodubfdmmqfwsznzbs.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjbG9kdWJmZG1tcWZ3c3puemJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MzA1MTMsImV4cCI6MjEwMzMwNjUxM30.mfF_8FWI_7IF1JlGlQTU3647CrioDteoCKjY2MCChrQ";
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadRepository() {
      const grid = document.getElementById('repository-grid');
      const statusMsg = document.getElementById('status-msg');

      try {
        const { data: articles, error } = await db
          .from('knowledge_repository')
          .select('*');

        if (error) {
          console.error('Supabase Error:', error);
          statusMsg.textContent = `Error fetching data: ${error.message}`;
          return;
        }

        if (!articles || articles.length === 0) {
          statusMsg.textContent = "Database table 'knowledge_repository' contains 0 records.";
          return;
        }

        grid.innerHTML = ''; // Clear loading text

        articles.forEach((article) => {
          const bodyText = article.summary || article.content || 'No content provided.';
          const card = document.createElement('div');
          card.className = 'card';

          card.innerHTML = `
            <div>
              <div class="badges">
                <span class="badge">${article.tier_required || 'FREE'}</span>
                <span class="badge">${article.category || 'MACRO'}</span>
              </div>
              <h3 class="card-title">${article.title}</h3>
              <div class="card-snippet">${bodyText}</div>
            </div>
            <button class="read-btn">Read Breakdown</button>
          `;

          card.querySelector('.read-btn').addEventListener('click', () => {
            openModal(article.title, bodyText, article.tier_required);
          });

          grid.appendChild(card);
        });

      } catch (err) {
        console.error('Fetch error:', err);
        statusMsg.textContent = `Failed to load: ${err.message}`;
      }
    }

    function openModal(title, body, tier) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').textContent = body;
      document.getElementById('modal-tier').textContent = tier || 'FREE';

      document.getElementById('modal-drawer').classList.add('open');
      document.getElementById('drawer-overlay').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal-drawer').classList.remove('open');
      document.getElementById('drawer-overlay').classList.remove('open');
    }

    loadRepository();
  </script>
</body>
</html>
